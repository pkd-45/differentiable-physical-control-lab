[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "differentiable-physical-control-lab"
version = "0.2.1"
description = "Auditable JAX trajectory optimisation for a constrained nonlinear physical system."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Pratyush Kumar Das"},
]
keywords = [
    "jax",
    "differentiable-physics",
    "trajectory-optimisation",
    "control",
    "dynamical-systems",
    "scientific-computing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "jax>=0.4,<1",
    "numpy>=1.24,<3",
    "matplotlib>=3.7,<4",
]

[project.urls]
Repository = "https://github.com/pkd-45/differentiable-physical-control-lab"
Issues = "https://github.com/pkd-45/differentiable-physical-control-lab/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
