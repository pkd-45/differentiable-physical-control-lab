name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check frozen source-tree hygiene
        run: python3 scripts/check_source_tree.py .

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Verify installed package metadata
        run: python scripts/check_package_metadata.py

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m compileall -q src tests scripts

      - name: Run end-to-end benchmark
        run: python scripts/run_demo.py --output-dir validation_runs/ci

      - name: Validate benchmark products and scientific behaviour
        run: python scripts/validate_outputs.py validation_runs/ci
